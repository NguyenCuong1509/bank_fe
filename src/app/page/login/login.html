<div class="min-h-screen bg-gradient-to-br from-indigo-950 via-slate-900 to-indigo-900 flex items-center justify-center p-4">
  
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 border border-slate-100">
    
    <!-- Header Logo & Title -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-400 to-yellow-300 mx-auto flex items-center justify-center shadow-lg shadow-amber-500/20 mb-3">
        <svg class="w-9 h-9 text-indigo-950 font-bold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Bank<span class="text-amber-500">Manager</span></h1>
      <p class="text-xs text-slate-500 mt-1">Cổng Quản trị Hệ thống Ngân hàng Cốt lõi</p>
    </div>

    <!-- Form Đăng nhập -->
    <form class="space-y-5">
      <div>
        <label for="username" class="block text-xs font-semibold text-slate-700 uppercase mb-1.5">Tên đăng nhập (Username)</label>
        <div class="relative">
          <input 
            id="username" 
            type="text" 
            placeholder="Nhập tên đăng nhập của bạn..." 
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition"
          />
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="password" class="block text-xs font-semibold text-slate-700 uppercase">Mật khẩu</label>
          <a href="#" class="text-xs text-indigo-600 hover:underline">Quên mật khẩu?</a>
        </div>
        <div class="relative">
          <input 
            id="password" 
            type="password" 
            placeholder="••••••••" 
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition"
          />
        </div>
      </div>

      <div class="flex items-center">
        <input id="remember" type="checkbox" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-slate-300 rounded" />
        <label for="remember" class="ml-2 block text-xs text-slate-600">Ghi nhớ đăng nhập trên thiết bị này</label>
      </div>

      <button 
        type="submit" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl text-sm shadow-md shadow-indigo-600/30 transition transform active:scale-[0.98]"
      >
        Đăng nhập vào Hệ thống
      </button>
    </form>

    <!-- Footer info -->
    <div class="mt-8 pt-6 border-t border-slate-100 text-center">
      <p class="text-[11px] text-slate-400">
        Bảo mật 256-bit SSL | Tương thích Spring Security OAuth2 / JWT
      </p>
    </div>

  </div>

</div>
